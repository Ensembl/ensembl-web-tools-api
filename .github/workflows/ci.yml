# Runs the test suite on every push to main and every pull request.
#
# The real pipeline lives in .gitlab-ci.yml and runs on the GitLab mirror
# (gitlab.ebi.ac.uk), which never sees work pushed to a GitHub fork — so
# without this, nothing runs on a PR here. The steps deliberately mirror that
# pipeline's Test stage so the two cannot drift into disagreeing.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GitLab uses 3.10. 3.11 is what the suite is developed against locally,
      # and 3.12 cannot build the pinned vcfpy fork.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # vcf_meta.py and vcf_results.py shell out to bcftools, so it is a real
      # runtime dependency, not just a test one. test_paging and
      # test_negative_paging are the two tests that reach it.
      - name: Install bcftools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bcftools

      # tests/test_blast.py reads /data/blast_config.json by absolute path, so
      # the config has to be staged there. Same step the GitLab pipeline runs.
      - name: Stage the blast config
        run: sudo cp -r ./data /data

      - name: Run tests
        working-directory: app
        run: |
          cp .env.sample .env
          python -m pytest -q
