<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t2 d2">
  <title id="t2">beta-vep data flow with manual pipeline gap</title>
  <desc id="d2">Sequence of calls for the beta-web-vep app and the local tools API in DUMP_INI and LOCAL_RESULTS modes, with a manual step where the operator runs the Nextflow VEP pipeline on the generated config and returns the output VCF.</desc>
  <style>
    text{font-family:system-ui,'Inter',sans-serif;}
    .title{fill:#16202b;font-weight:700;font-size:17px;}
    .head{fill:#eef2f6;stroke:#c4cdd8;rx:7;}
    .headt{fill:#16202b;font-weight:600;font-size:12.5px;}
    .heads{fill:#5a6776;font-size:10px;}
    .life{stroke:#c4cdd8;stroke-width:1.4;stroke-dasharray:3 5;}
    .msg{fill:#26313d;font-size:11px;}
    .int{stroke:#5b6b7a;stroke-width:1.6;}
    .ext{stroke:#e8800c;stroke-width:1.6;}
    .man{stroke:#7c5cff;stroke-width:1.8;}
    .ret{stroke-dasharray:5 4;}
    .noteb{fill:#eef2f6;stroke:#c4cdd8;rx:5;}
    .notet{fill:#46525f;font-size:10px;}
    .band{fill:#f1ecff;stroke:#7c5cff;stroke-dasharray:4 4;rx:8;opacity:0.9;}
    .bandlbl{fill:#6a49f2;font-weight:700;font-size:11px;}
    .lgd{fill:#5a6776;font-size:11px;}
  </style>
  <defs>
    <marker id="bI" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6b7a"/></marker>
    <marker id="bE" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e8800c"/></marker>
    <marker id="bM" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c5cff"/></marker>
  </defs>

  <text class="title" x="24" y="30">beta-vep — config generated locally, pipeline run manually, results parsed back</text>

  <rect class="band" x="470" y="338" width="470" height="132"/>
  <text class="bandlbl" x="486" y="357">MANUAL · outside the app</text>

  <rect class="head" x="40" y="50" width="150" height="44"/><text class="headt" x="115" y="70" text-anchor="middle">Browser</text><text class="heads" x="115" y="84" text-anchor="middle">beta-web-vep</text>
  <rect class="head" x="270" y="50" width="160" height="44"/><text class="headt" x="350" y="70" text-anchor="middle">Local Tools API</text><text class="heads" x="350" y="84" text-anchor="middle">DUMP_INI · LOCAL_RESULTS</text>
  <rect class="head" x="490" y="50" width="150" height="44"/><text class="headt" x="565" y="70" text-anchor="middle">data/output</text><text class="heads" x="565" y="84" text-anchor="middle">shared disk</text>
  <rect class="head" x="710" y="50" width="160" height="44"/><text class="headt" x="790" y="70" text-anchor="middle">You + Nextflow</text><text class="heads" x="790" y="84" text-anchor="middle">local VEP run</text>
  <rect class="head" x="965" y="50" width="170" height="44"/><text class="headt" x="1050" y="70" text-anchor="middle">Ensembl Web API</text><text class="heads" x="1050" y="84" text-anchor="middle">external · staging</text>

  <line class="life" x1="115" y1="94" x2="115" y2="660"/>
  <line class="life" x1="350" y1="94" x2="350" y2="660"/>
  <line class="life" x1="565" y1="94" x2="565" y2="660"/>
  <line class="life" x1="790" y1="94" x2="790" y2="660"/>
  <line class="life" x1="1050" y1="94" x2="1050" y2="660"/>

  <g text-anchor="middle">
    <line class="ext" x1="115" y1="122" x2="1045" y2="122" marker-end="url(#bE)"/><text class="msg" x="580" y="116">1 · species search → ENSEMBL_API_TARGET (staging)</text>
  </g>
  <rect class="noteb" x="60" y="138" width="250" height="30"/><text class="notet" x="185" y="157" text-anchor="middle">dev server mocks form_config + status</text>

  <g text-anchor="middle">
    <line class="int" x1="115" y1="196" x2="345" y2="196" marker-end="url(#bI)"/><text class="msg" x="230" y="190">2 · POST /submissions (LIVE_SUBMISSION)</text>
    <line class="ext" x1="350" y1="230" x2="1045" y2="230" marker-end="url(#bE)"/><text class="msg" x="700" y="224">3 · resolve gff / fasta</text>
    <line class="int" x1="350" y1="264" x2="560" y2="264" marker-end="url(#bI)"/><text class="msg" x="455" y="258">4 · write config.ini (DUMP_INI)</text>
    <line class="int ret" x1="350" y1="298" x2="120" y2="298" marker-end="url(#bI)"/><text class="msg" x="235" y="292">5 · dump-id  ·  Seqera NOT called</text>
  </g>

  <g text-anchor="middle">
    <line class="man" x1="565" y1="384" x2="785" y2="384" marker-end="url(#bM)"/><text class="msg" x="675" y="378">6 · take config.ini</text>
    <line class="man ret" x1="785" y1="448" x2="570" y2="448" marker-end="url(#bM)"/><text class="msg" x="675" y="442">7 · write output.vcf.gz</text>
  </g>
  <rect class="noteb" x="676" y="396" width="228" height="42"/><text class="notet" x="790" y="413" text-anchor="middle">run Nextflow VEP on config.ini</text><text class="notet" x="790" y="427" text-anchor="middle">reads GFF + FASTA + plugin data</text>

  <g text-anchor="middle">
    <line class="int" x1="115" y1="500" x2="345" y2="500" marker-end="url(#bI)"/><text class="msg" x="230" y="494">8 · GET /results (LIVE_RESULTS)</text>
    <line class="int" x1="350" y1="534" x2="560" y2="534" marker-end="url(#bI)"/><text class="msg" x="455" y="528">9 · read output.vcf.gz (LOCAL_RESULTS_VCF)</text>
  </g>
  <rect class="noteb" x="250" y="546" width="220" height="30"/><text class="notet" x="360" y="565" text-anchor="middle">parse + structure (bcftools)</text>

  <g text-anchor="middle">
    <line class="int ret" x1="350" y1="606" x2="120" y2="606" marker-end="url(#bI)"/><text class="msg" x="235" y="600">10 · annotations JSON → MANE badges, OpenTargets, detail</text>
  </g>

  <line class="int" x1="50" y1="686" x2="82" y2="686" marker-end="url(#bI)"/><text class="lgd" x="88" y="690">internal HTTP / return</text>
  <line class="ext" x1="270" y1="686" x2="302" y2="686" marker-end="url(#bE)"/><text class="lgd" x="308" y="690">external call</text>
  <line class="man" x1="430" y1="686" x2="462" y2="686" marker-end="url(#bM)"/><text class="lgd" x="468" y="690">manual step (outside the app)</text>
  <text class="lgd" x="760" y="690">submit + status are dev-mocked · no Seqera</text>
</svg>
