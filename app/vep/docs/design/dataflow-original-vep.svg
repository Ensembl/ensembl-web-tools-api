<svg viewBox="0 0 1100 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t1 d1">
  <title id="t1">Original Ensembl VEP data flow</title>
  <desc id="d1">Sequence of calls between the ensembl-client browser app, the tools API, the Seqera/Nextflow runner, and the external Ensembl Web API, including form config, submission, status polling and results parsing.</desc>
  <style>
    text{font-family:system-ui,'Inter',sans-serif;}
    .title{fill:#16202b;font-weight:700;font-size:17px;}
    .head{fill:#eef2f6;stroke:#c4cdd8;rx:7;}
    .headt{fill:#16202b;font-weight:600;font-size:13px;}
    .heads{fill:#5a6776;font-size:10.5px;}
    .life{stroke:#c4cdd8;stroke-width:1.4;stroke-dasharray:3 5;}
    .msg{fill:#26313d;font-size:11.5px;}
    .note{fill:#fff7ec;stroke:#e8800c;rx:5;}
    .noteb{fill:#eef2f6;stroke:#c4cdd8;rx:5;}
    .notet{fill:#5a4a2e;font-size:10.5px;}
    .notetb{fill:#46525f;font-size:10.5px;}
    .int{stroke:#5b6b7a;stroke-width:1.6;}
    .ext{stroke:#e8800c;stroke-width:1.6;}
    .ret{stroke-dasharray:5 4;}
    .lgd{fill:#5a6776;font-size:11px;}
  </style>
  <defs>
    <marker id="aI" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5b6b7a"/></marker>
    <marker id="aE" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#e8800c"/></marker>
  </defs>

  <text class="title" x="24" y="30">Original VEP — ensembl-client → tools API → runner → back</text>

  <g>
    <rect class="head" x="50" y="48" width="150" height="44"/><text class="headt" x="125" y="68" text-anchor="middle">Browser</text><text class="heads" x="125" y="83" text-anchor="middle">ensembl-client</text>
    <rect class="head" x="305" y="48" width="150" height="44"/><text class="headt" x="380" y="68" text-anchor="middle">Tools API</text><text class="heads" x="380" y="83" text-anchor="middle">FastAPI</text>
    <rect class="head" x="560" y="48" width="170" height="44"/><text class="headt" x="645" y="66" text-anchor="middle">Runner</text><text class="heads" x="645" y="81" text-anchor="middle">Seqera · Nextflow · VEP</text>
    <rect class="head" x="850" y="48" width="180" height="44"/><text class="headt" x="940" y="66" text-anchor="middle">Ensembl Web API</text><text class="heads" x="940" y="81" text-anchor="middle">external</text>
  </g>
  <line class="life" x1="125" y1="92" x2="125" y2="678"/>
  <line class="life" x1="380" y1="92" x2="380" y2="678"/>
  <line class="life" x1="645" y1="92" x2="645" y2="678"/>
  <line class="life" x1="940" y1="92" x2="940" y2="678"/>

  <g text-anchor="middle">
    <line class="ext" x1="125" y1="120" x2="935" y2="120" marker-end="url(#aE)"/><text class="msg" x="530" y="114">1 · species search / genome metadata</text>

    <line class="int" x1="125" y1="156" x2="375" y2="156" marker-end="url(#aI)"/><text class="msg" x="250" y="150">2 · GET /form_config</text>
    <line class="ext" x1="380" y1="190" x2="935" y2="190" marker-end="url(#aE)"/><text class="msg" x="650" y="184">3 · genome metadata</text>
    <line class="int ret" x1="380" y1="224" x2="130" y2="224" marker-end="url(#aI)"/><text class="msg" x="255" y="218">4 · form parameters</text>

    <line class="int" x1="125" y1="264" x2="375" y2="264" marker-end="url(#aI)"/><text class="msg" x="250" y="258">5 · POST /submissions · VCF + parameters</text>
    <line class="ext" x1="380" y1="298" x2="935" y2="298" marker-end="url(#aE)"/><text class="msg" x="650" y="292">6 · resolve gff / fasta</text>
    <line class="ext" x1="380" y1="332" x2="640" y2="332" marker-end="url(#aE)"/><text class="msg" x="512" y="326">7 · launch workflow + config.ini</text>
    <line class="int ret" x1="380" y1="366" x2="130" y2="366" marker-end="url(#aI)"/><text class="msg" x="255" y="360">8 · submission_id</text>

    <line class="int" x1="125" y1="406" x2="375" y2="406" marker-end="url(#aI)"/><text class="msg" x="250" y="400">9 · poll /status  (repeat)</text>
    <line class="ext" x1="380" y1="440" x2="640" y2="440" marker-end="url(#aE)"/><text class="msg" x="512" y="434">10 · workflow status</text>
  </g>

  <rect class="note" x="556" y="458" width="330" height="40"/>
  <text class="notet" x="572" y="475">Nextflow runs VEP — reads GFF + FASTA (no cache,</text>
  <text class="notet" x="572" y="490">no plugins), writes &lt;input&gt;_VEP.vcf.gz to workDir</text>

  <g text-anchor="middle">
    <line class="int" x1="125" y1="528" x2="375" y2="528" marker-end="url(#aI)"/><text class="msg" x="250" y="522">11 · GET /results</text>
  </g>
  <rect class="noteb" x="300" y="540" width="200" height="34"/>
  <text class="notetb" x="400" y="561" text-anchor="middle">read VCF + parse (bcftools)</text>

  <g text-anchor="middle">
    <line class="int ret" x1="380" y1="600" x2="130" y2="600" marker-end="url(#aI)"/><text class="msg" x="255" y="594">12 · parsed results (JSON)</text>
    <line class="int" x1="125" y1="638" x2="375" y2="638" marker-end="url(#aI)"/><text class="msg" x="250" y="632">13 · GET /download → result VCF</text>
  </g>

  <line class="int" x1="60" y1="694" x2="92" y2="694" marker-end="url(#aI)"/><text class="lgd" x="98" y="698">internal HTTP / return (dashed)</text>
  <line class="ext" x1="320" y1="694" x2="352" y2="694" marker-end="url(#aE)"/><text class="lgd" x="358" y="698">external call</text>
  <text class="lgd" x="560" y="698">external: Ensembl Web API · Seqera Platform · VEP GFF + FASTA data</text>
</svg>
